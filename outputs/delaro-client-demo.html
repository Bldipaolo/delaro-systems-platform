<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Delaro · Northstar workspace</title>
  <style>
    :root{--navy:#263b4c;--slate:#526979;--teal:#55a99b;--teal-soft:#e1f0ed;--paper:#f7f7f3;--white:#fff;--line:#dce3e3;--muted:#66777f;--warn:#b47b36;--radius:7px;--display:Manrope,Arial,sans-serif;--body:Inter,Arial,sans-serif}*{box-sizing:border-box}html,body{margin:0;overflow-x:clip}body{background:var(--paper);color:var(--navy);font:14px var(--body),sans-serif;-webkit-font-smoothing:antialiased}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.shell{min-height:100vh;display:flex}.sidebar{width:246px;flex:0 0 246px;min-height:100vh;background:var(--navy);color:var(--white);padding:30px 18px;display:flex;flex-direction:column}.brand{display:flex;gap:10px;align-items:center;font:600 12px var(--display);letter-spacing:.16em}.mark{width:24px;height:24px;border:1px solid var(--teal);color:var(--teal);display:grid;place-items:center;letter-spacing:0}.workspace{margin:52px 11px 12px;color:#bfcbd0;font-size:9px;font-weight:600;letter-spacing:.16em}.org{display:flex;align-items:center;gap:10px;border:1px solid #ffffff26;background:#ffffff0f;color:white;border-radius:var(--radius);padding:10px;text-align:left}.avatar{width:28px;height:28px;border-radius:50%;background:var(--teal);color:var(--navy);display:grid;place-items:center;font-size:11px;font-weight:600}.org span:nth-child(2){display:flex;flex-direction:column;gap:3px;flex:1}.org small{color:#bfcbd0;font-size:10px}.nav-label{margin:42px 12px 12px;color:#bfcbd0;font-size:9px;letter-spacing:.16em}.nav button{display:block;width:100%;border:0;border-radius:var(--radius);background:transparent;color:#bfcbd0;padding:11px 12px;text-align:left;font-size:13px;margin:2px 0}.nav button:hover,.nav button.active{background:#ffffff17;color:#fff}.nav button.active{box-shadow:inset 2px 0 var(--teal)}.side-bottom{margin-top:auto;border-top:1px solid #ffffff26;padding:18px 11px 0;color:#bfcbd0}.side-bottom p{font:15px/1.4 var(--display);margin:12px 0 24px}.user{display:flex;gap:9px;align-items:center;font-size:11px}.user .avatar{background:var(--slate);color:#fff}.user small{display:block;color:#bfcbd0;font-size:10px;margin-top:3px}.main{flex:1;min-width:0}.top{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 48px}.crumb{font-size:12px;color:var(--muted)}.crumb strong{color:var(--navy);font-weight:500}.top-actions{display:flex;gap:18px;align-items:center}.demo{color:var(--muted);font-size:11px}.content{max-width:1220px;margin:auto;padding:62px 48px 90px}.eyebrow{color:var(--teal);font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;margin:0 0 15px}.intro{display:flex;justify-content:space-between;align-items:end;gap:40px;padding-bottom:50px}.intro h1{font:400 clamp(38px,5vw,64px)/1.04 var(--display);letter-spacing:-.035em;margin:0 0 18px}.intro p{max-width:55ch;color:var(--muted);line-height:1.7;margin:0}.next{min-width:210px;border-top:1px solid var(--teal);padding-top:12px;color:var(--muted);font-size:11px}.next strong{display:block;color:var(--navy);font:500 16px var(--display);margin-top:7px}.summary{display:grid;grid-template-columns:repeat(4,1fr);border-block:1px solid var(--line);margin-bottom:64px}.summary div{padding:20px 22px 19px 0;border-right:1px solid var(--line)}.summary div+div{padding-left:22px}.summary div:last-child{border:0}.summary span,.summary small{display:block;color:var(--muted);font-size:11px}.summary strong{display:block;font:400 27px var(--display);margin:8px 0}.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px}.section-head h2,.panel h2{font:400 23px var(--display);margin:0}.section-note{color:var(--muted);font-size:11px}.list{border-top:1px solid var(--line);margin-bottom:64px}.row{display:grid;grid-template-columns:42px 1fr 110px 100px;gap:18px;align-items:center;border-bottom:1px solid var(--line);padding:20px 0}.row strong{font:500 15px var(--display)}.row p{color:var(--muted);font-size:12px;line-height:1.5;margin:7px 0 0}.num{color:var(--teal);font:12px var(--display)}.row small,.meta{color:var(--muted);font-size:10px}.progress{height:4px;background:var(--line);margin-top:8px}.progress span{display:block;height:100%;background:var(--teal)}.panels{display:grid;grid-template-columns:1.5fr .9fr;gap:20px}.panel{border:1px solid var(--line);padding:24px;background:#ffffff40}.panel p{color:var(--muted);font-size:12px;line-height:1.6}.toolbar{display:flex;justify-content:space-between;gap:14px;border-block:1px solid var(--line);padding:14px 0;margin-bottom:22px}.toolbar-actions{display:flex;gap:8px}.primary,.secondary{border-radius:var(--radius);padding:10px 13px;font-size:11px}.primary{border:0;background:var(--navy);color:#fff}.secondary{border:1px solid var(--line);background:transparent;color:var(--navy)}.primary:hover{background:var(--teal);color:var(--navy)}.table{border-top:1px solid var(--line)}.table-row{display:grid;grid-template-columns:1.4fr 1fr 1fr 100px;gap:18px;align-items:center;border-bottom:1px solid var(--line);padding:18px 0;font-size:11px}.table-row strong{font:500 14px var(--display)}.table-row span{color:var(--muted)}.detail{border-top:1px solid var(--teal);padding-top:16px;margin-top:30px;max-width:580px}.detail h2{font:400 24px var(--display);margin:14px 0}.detail p{color:var(--muted);line-height:1.7;font-size:12px}.check{border-top:1px solid var(--line);max-width:840px}.check-item{border-bottom:1px solid var(--line)}.check-title{width:100%;display:grid;grid-template-columns:32px 1fr 20px;gap:16px;border:0;background:transparent;text-align:left;padding:21px 0;color:var(--navy)}.check-title strong{display:block;font:500 16px var(--display);margin:7px 0}.check-title small,.check-title em{display:block;color:var(--muted);font-size:11px;font-style:normal;line-height:1.5}.check-mark{width:23px;height:23px;border:1px solid var(--teal);color:var(--teal);display:grid;place-items:center}.check-body{display:flex;flex-direction:column;gap:12px;background:#fff6;padding:16px;margin:0 0 20px 48px;font-size:11px}.check-body label{display:flex;gap:9px;align-items:center;color:var(--slate)}.hidden{display:none}.notice{position:fixed;right:24px;bottom:22px;background:var(--navy);color:#fff;border:1px solid var(--teal);border-radius:var(--radius);padding:12px 15px;font-size:12px}.modal{position:fixed;inset:0;background:#182b3b66;display:flex;justify-content:flex-end}.modal-card{width:min(500px,100%);height:100%;overflow:auto;background:var(--paper);padding:32px}.modal-card h2{font:400 24px var(--display)}.form{display:flex;flex-direction:column;gap:14px}.form label{display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:10px}.form input,.form textarea,.form select{border:1px solid var(--line);border-radius:var(--radius);background:#fff;padding:10px;color:var(--navy)}.form textarea{min-height:86px}.form-actions{display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line);padding-top:18px;margin-top:8px}@media(max-width:800px){.sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);z-index:4}.sidebar.open{transform:none}.menu{display:block!important;position:fixed;z-index:5;top:17px;left:18px}.top{padding:14px 24px 14px 88px;height:auto}.top-actions .demo{display:none}.content{padding:42px 24px 65px}.intro{display:block}.next{margin-top:28px}.summary{grid-template-columns:repeat(2,1fr)}.summary div:nth-child(2){border-right:0}.summary div:nth-child(3),.summary div:nth-child(4){border-top:1px solid var(--line)}.summary div:nth-child(3){padding-left:0}.panels{grid-template-columns:1fr}.table-row{grid-template-columns:1fr 1fr}.table-row strong{grid-column:span 2}.toolbar{align-items:flex-start;flex-direction:column}.row{grid-template-columns:26px 1fr}.row>small,.row>.progress{grid-column:2}.row>.meta{display:none}}@media(min-width:801px){.menu{display:none!important}}@media(max-width:500px){.content{padding-inline:18px}.summary strong{font-size:23px}.summary div,.summary div+div{padding:15px 12px}.intro h1{font-size:42px}.top-actions .secondary{font-size:0;padding:0;border:0}.top-actions .secondary:after{content:'↗';font-size:18px}}
  </style>
</head>
<body>
<div class="shell"><aside class="sidebar" id="sidebar"><div class="brand"><span class="mark">D</span><span>DELARO</span></div><div class="workspace">NORTHSTAR WORKSPACE</div><button class="org"><span class="avatar">N</span><span><b>Northstar</b><small>Client workspace</small></span><span>⌄</span></button><nav class="nav"><div class="nav-label">WORKSPACE</div><button class="active" data-page="home">Home</button><button data-page="projects">Projects</button><button data-page="results">Results</button><button data-page="files">Files</button><button data-page="checkins">Check-ins</button></nav><div class="side-bottom"><div>CONTINUITY</div><p>See the work.<br>Know what happens next.</p><div class="user"><span class="avatar">JD</span><span><b>Jordan Davis</b><small>Client admin</small></span></div></div></aside><button class="menu secondary" onclick="document.getElementById('sidebar').classList.toggle('open')">Menu</button><main class="main"><header class="top"><div class="crumb">Northstar Manufacturing <strong>/ Client workspace</strong></div><div class="top-actions"><span class="demo">Offline demo</span><button class="secondary" onclick="exportBrief()">Export brief</button><button class="secondary" onclick="resetDemo()">Reset</button></div></header><div id="app"></div></main></div>
<div id="notice" class="notice hidden"></div>
<script>
const seed={projects:[{name:'Quote-to-order handoff',desc:'Reduce delay and ambiguity between commercial approval and production planning.',stage:'Design',progress:58,next:'Validate handoff map · 10 Oct',owner:'Maya Chen',status:'On track'},{name:'Capacity visibility',desc:'Give operations a dependable view of committed and available production capacity.',stage:'Validation',progress:31,next:'Confirm source data · 14 Oct',owner:'Elliot Stone',status:'Needs attention'}],files:[{name:'What we found',type:'Summary',date:'6 Oct 2026',desc:'A plain-language summary of what we observed and the projects selected for the first improvement cycle.'},{name:'Quote-to-order handoff map',type:'Project plan',date:'3 Oct 2026',desc:'A working map of how an approved order moves into production planning.'},{name:'Next check-in agenda',type:'Check-in',date:'17 Oct 2026',desc:'The progress, questions, and choices prepared for the next check-in.'}]};
let data=JSON.parse(localStorage.getItem('delaro.offline.demo')||'null')||seed;let current='home';
function save(){localStorage.setItem('delaro.offline.demo',JSON.stringify(data))}function notice(text){const el=document.getElementById('notice');el.textContent=text;el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),2200)}function resetDemo(){localStorage.removeItem('delaro.offline.demo');data=JSON.parse(JSON.stringify(seed));render();notice('Demo reset.')}function exportBrief(){const text='DELARO · NORTHSTAR MANUFACTURING\n\nWhat we are working on\n- Shorten the quote-to-order handoff\n- Create reliable production capacity visibility\n- Measure rework cost at the source\n\nNext check-in: 17 October 2026';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));a.download='northstar-review-brief.txt';a.click();notice('Brief downloaded.')}function shell(title,kicker,copy,body){return `<div class="content"><section class="intro"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${copy}</p></div>${title==='See what is changing.'?'<div class="next">Next check-in<strong>17 October 2026</strong></div>':''}</section>${body}</div>`}function home(){return shell('See what is changing.','Your workspace','A simple view of the work underway at Northstar Manufacturing, what it is helping, and where your input is needed next.',`<section class="summary"><div><span>Projects underway</span><strong>${data.projects.length.toString().padStart(2,'0')}</strong><small>Work currently in motion</small></div><div><span>Expected impact</span><strong>—</strong><small>To be confirmed</small></div><div><span>Impact so far</span><strong>—</strong><small>Verified results only</small></div><div><span>Needs your input</span><strong>02</strong><small>Questions to resolve</small></div></section><div class="section-head"><div><div class="eyebrow">Focus now</div><h2>What we are working on</h2></div><span class="section-note">The few things that matter most right now</span></div><section class="list">${['Shorten the quote-to-order handoff','Create reliable production capacity visibility','Measure rework cost at the source'].map((x,i)=>`<div class="row"><span class="num">0${i+1}</span><strong>${x}</strong><span class="meta">Current priority</span></div>`).join('')}</section><div class="panels"><div class="panel"><div class="eyebrow">Impact</div><h2>What will improve</h2><p>We will add verified savings, capacity created, and time saved here when the evidence is ready.</p></div><div class="panel"><div class="eyebrow">Your input</div><h2>Questions to answer</h2><p>Two questions are waiting for context before the next step can begin.</p><button class="secondary" onclick="go('checkins')">See what needs you →</button></div></div>`)}function projects(){return shell('Projects','Work in progress','See the work underway, who owns the next step, and how far along it is.',`<div class="toolbar"><span class="meta">Demo workspace · changes stay on this device</span><button class="primary" onclick="openProject()">Add project →</button></div><section class="list">${data.projects.map((p,i)=>`<div class="row"><span class="num">0${i+1}</span><div><strong>${p.name}</strong><p>${p.desc}</p></div><div><small>Next step</small><p>${p.next}</p></div><div><small>${p.progress}% complete</small><div class="progress"><span style="width:${p.progress}%"></span></div></div></div>`).join('')}</section>`)}function results(){return shell('Results','What is changing','See what is improving, what still needs evidence, and where the next result should come from.',`<div class="toolbar"><span class="meta">Verified values are intentionally blank until evidence is ready.</span><button class="secondary" onclick="notice('Results are ready to connect to verified data later.')">How results are counted →</button></div><section class="list">${[['Quote-to-order cycle time','8.4 days','5.5 days','—'],['Rework cost at source','—','—','—'],['Capacity plan confidence','62%','90%','—']].map(x=>`<div class="row"><span></span><div><strong>${x[0]}</strong><p>We will compare where things started with the expected result.</p></div><span><small>Started · ${x[1]}</small><br><small>Expected · ${x[2]}</small></span><strong>${x[3]}</strong></div>`).join('')}</section>`)}function files(){return shell('Files','Shared files','Find the plans, notes, and reports that explain what we found and what happens next.',`<div class="toolbar"><span class="meta">${data.files.length} files in this demo workspace</span><button class="primary" onclick="openFile()">Add file →</button></div><section class="list">${data.files.map((f,i)=>`<button class="row" style="width:100%;border-inline:0;background:transparent;text-align:left" onclick="notice('${f.desc.replaceAll("'","\\'")}')"><span class="num">0${i+1}</span><div><strong>${f.name}</strong><p>${f.desc}</p></div><span class="meta">${f.type}</span><span class="meta">${f.date}</span></button>`).join('')}</section>`)}function checkins(){return shell('Check-ins','Stay aligned','Use these check-ins to look at what changed, answer open questions, and agree on what happens next.',`<section class="check"><div class="check-item"><button class="check-title" onclick="this.nextElementSibling.classList.toggle('hidden')"><span class="check-mark">→</span><span><small>17 Oct 2026 · Upcoming</small><strong>Next check-in</strong><em>Look at what has changed, answer the open questions, and agree on the next step.</em></span><span>+</span></button><div class="check-body hidden"><label><input type="checkbox" onchange="notice('Checklist updated.')"> Choose who will provide the source data</label><label><input type="checkbox" onchange="notice('Checklist updated.')"> Confirm the next step</label><button class="secondary" onclick="notice('Your note is ready for the shared record.')">Add a note →</button></div></div><div class="check-item"><button class="check-title" onclick="this.nextElementSibling.classList.toggle('hidden')"><span class="check-mark">✓</span><span><small>18 Jul 2026 · Complete</small><strong>Starting point</strong><em>Agreed on the three areas where a clearer process could make the biggest difference.</em></span><span>+</span></button><div class="check-body hidden"><p>Three priorities were selected for the first improvement cycle.</p></div></div></section>`)}function openProject(){const name=prompt('Project name');if(name){data.projects.unshift({name,desc:'New project added in offline demo mode.',stage:'Validation',progress:0,next:'Define the next step',owner:'Jordan Davis',status:'On track'});save();render();notice('Project added.')}}function openFile(){const name=prompt('File name');if(name){data.files.unshift({name,type:'Shared file',date:'Today',desc:'New file added in offline demo mode.'});save();render();notice('File added.')}}function go(page){current=page;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));render();window.scrollTo(0,0)}function render(){document.getElementById('app').innerHTML={home,projects,results,files,checkins}[current]()}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));render();
</script>
</body>
</html>
